<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>__TITLE__</title><style>
*{box-sizing:border-box}body{margin:0;background:#111315;color:#eee9df;font:12px system-ui,-apple-system,sans-serif;overflow:hidden}main{height:100dvh;display:grid;place-items:center}#board{display:block;width:100%;height:100%;object-fit:contain;user-select:none;-webkit-user-drag:none}#ink{position:fixed;inset:0;touch-action:none;z-index:2;cursor:var(--pencil)}body.pointer #ink{pointer-events:none}nav{position:fixed;z-index:4;bottom:18px;left:50%;transform:translateX(-50%);display:flex;gap:4px;align-items:center;padding:6px;border:1px solid #ffffff12;border-radius:13px;background:#24242bea;box-shadow:0 8px 28px #0003;backdrop-filter:blur(16px);max-width:calc(100vw - 24px)}button,select,a{font:inherit;color:#d5d5de}button,a{width:32px;height:32px;border:0;border-radius:7px;background:transparent;display:inline-flex;align-items:center;justify-content:center;cursor:pointer;text-decoration:none;flex-shrink:0}button:hover,a:hover{background:#ffffff10;color:#fff}button:focus-visible,a:focus-visible,select:focus-visible{outline:2px solid #b4aaff;outline-offset:2px}button:disabled{opacity:.3;cursor:default}button[aria-pressed="true"]{color:#cec7ff;background:#a89aff23}svg{width:17px;height:17px;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}select{height:30px;width:180px;border:0;border-radius:6px;background:#ffffff08;padding:0 8px;cursor:pointer;min-width:0}option{background:#24242b}#count{font-size:11px;font-variant-numeric:tabular-nums;min-width:40px;text-align:center;color:#aaa9b7}.divider{height:18px;width:1px;background:#ffffff18;margin:0 3px;flex-shrink:0}#notes{position:fixed;z-index:3;left:24px;top:24px;max-width:min(640px,70vw);font-size:15px;line-height:1.5;background:#24242bf5;color:#eee9df;padding:16px 20px;border:1px solid #ffffff15;border-radius:12px;box-shadow:0 8px 25px #0002}#notes[hidden]{display:none}#restore{position:fixed;z-index:4;left:50%;bottom:5px;transform:translateX(-50%);width:42px;height:22px;background:#24242b;color:#bbb;opacity:0;visibility:hidden;pointer-events:none}body.hide nav,body.hide #notes{display:none!important}body.hide #restore{opacity:.25;visibility:visible;pointer-events:auto}body.hide #restore:hover,body.hide #restore:focus-visible{opacity:1}#hint{position:fixed;z-index:5;bottom:70px;left:50%;transform:translateX(-50%);background:#24242bf0;color:#ddd;padding:9px 14px;border-radius:8px;pointer-events:none;white-space:nowrap;opacity:0;transition:opacity .2s}#hint.visible{opacity:1}@media(max-width:760px){select{width:135px}.extra{display:none}}@media(max-width:480px){select{display:none}nav{gap:2px}nav button{width:30px}}
</style></head><body><main><img id="board" alt="" draggable="false"></main><canvas id="ink" aria-label="Temporary presentation marker. Drag to draw fading marks; P toggles the pencil; C clears marks."></canvas><aside id="notes" hidden></aside><div id="hint" role="status"></div>
<nav aria-label="Presentation controls">
<button id="previous" aria-label="Previous drawing" title="Previous · ←"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg></button><span id="count"></span><button id="next" aria-label="Next drawing" title="Next · →"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 5l7 7-7 7"/></svg></button><select id="list" aria-label="Choose drawing"></select><span class="divider"></span>
<button id="pen" aria-label="Vanishing pencil" aria-pressed="true" title="Vanishing pencil · P"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 20l1-5L16 4a2 2 0 013 3L8 19l-4 1zM14 6l4 4"/></svg></button><button id="clear" aria-label="Clear temporary marks" title="Clear marks · C"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 7h14M9 7V4h6v3M7 7l1 13h8l1-13M10 10v7M14 10v7"/></svg></button><button id="theme" aria-label="Switch to light preview" title="Switch to light preview"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M5 5l1.5 1.5M17.5 17.5L19 19M5 19l1.5-1.5M17.5 6.5L19 5"/></svg></button><button id="cue" class="extra" aria-label="Presenter notes" aria-pressed="false" title="Presenter notes · N"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="5" y="3" width="14" height="18" rx="2"/><path d="M9 8h6M9 12h6M9 16h4"/></svg></button><button id="fullscreen" class="extra" aria-label="Toggle fullscreen" title="Fullscreen · F"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 3H3v5M16 3h5v5M21 16v5h-5M8 21H3v-5"/></svg></button><span class="divider extra"></span><a class="extra" href="__OTHER_URL__" aria-label="__OTHER__" title="__OTHER__"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M10 7l5 5-5 5M4 12h11M16 4h4v16h-4"/></svg></a><a id="native" class="extra" aria-label="Editable Excalidraw scene" title="Editable Excalidraw scene"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M13 4H5v16h14v-8M12 12l1-4 6-6 3 3-6 6-4 1z"/></svg></a><button id="hide" aria-label="Hide controls" title="Hide controls · H"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 9l7 7 7-7"/></svg></button></nav><button id="restore" aria-label="Show controls" title="Show controls · H"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 15l7-7 7 7"/></svg></button>
<script>
// Embedded metadata keeps the presentation usable directly from disk and offline.
const boards=__BOARDS__;
const $=id=>document.getElementById(id);let index=0,dark=true,pencil=true;
const canvas=$('ink'),ctx=canvas.getContext('2d');let strokes=[],active=null,frame=0;
const pencilSvg='<svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 32 32"><g fill="none" stroke="COLOR" stroke-width="1.6" stroke-linejoin="round"><path d="M5 26l2-8L23 2l6 6-16 16-8 2z"/><path d="M7 18l6 6M20 5l6 6M5 26l4-1-3-3zM10 19L23 6"/></g></svg>';
function cursor(){document.body.style.setProperty('--pencil',`url("data:image/svg+xml,${encodeURIComponent(pencilSvg.replace('COLOR',dark?'#eee9df':'#252730'))}") 5 26, crosshair`)}
function clearInk(){strokes=[];active=null;ctx.clearRect(0,0,innerWidth,innerHeight)}
function resize(){const dpr=devicePixelRatio||1;canvas.width=Math.round(innerWidth*dpr);canvas.height=Math.round(innerHeight*dpr);canvas.style.width=innerWidth+'px';canvas.style.height=innerHeight+'px';ctx.setTransform(dpr,0,0,dpr,0,0);clearInk()}
function paint(now){frame=0;ctx.clearRect(0,0,innerWidth,innerHeight);strokes=strokes.filter(s=>s===active||now-s.ended<1500);for(const s of strokes){const age=s===active?0:now-s.ended;ctx.globalAlpha=age<700?1:Math.max(0,1-(age-700)/800);ctx.strokeStyle='#ff3636';ctx.fillStyle='#ff3636';ctx.lineWidth=3;ctx.lineCap='round';ctx.lineJoin='round';ctx.beginPath();const [first,...points]=s.points;ctx.moveTo(first.x,first.y);for(const p of points)ctx.lineTo(p.x,p.y);if(!points.length){ctx.arc(first.x,first.y,1.5,0,Math.PI*2);ctx.fill()}else ctx.stroke()}ctx.globalAlpha=1;if(strokes.length)frame=requestAnimationFrame(paint)}
function renderInk(){if(!frame)frame=requestAnimationFrame(paint)}
canvas.addEventListener('pointerdown',e=>{if(e.button!==0)return;e.preventDefault();active={points:[{x:e.clientX,y:e.clientY}],ended:0};strokes.push(active);canvas.setPointerCapture(e.pointerId);renderInk()});
canvas.addEventListener('pointermove',e=>{if(!active||!canvas.hasPointerCapture(e.pointerId))return;for(const p of e.getCoalescedEvents?.()||[e])active.points.push({x:p.clientX,y:p.clientY});renderInk()});
function finish(e){if(active){active.ended=performance.now();active=null;renderInk()}if(canvas.hasPointerCapture(e.pointerId))canvas.releasePointerCapture(e.pointerId)}
canvas.addEventListener('pointerup',finish);canvas.addEventListener('pointercancel',finish);canvas.addEventListener('lostpointercapture',()=>{if(active){active.ended=performance.now();active=null;renderInk()}});addEventListener('resize',resize);addEventListener('blur',()=>{if(active){active.ended=performance.now();active=null;renderInk()}});
$('list').replaceChildren(...boards.map((b,i)=>new Option(`${String(i+1).padStart(2,'0')} / ${b.state}`,i)));
function show(){clearInk();const b=boards[index];$('board').src=`drawings/svg-${dark?'dark':'light'}/${b.key}.svg`;$('board').alt=b.title+'. '+b.state+'. '+b.cue;$('count').textContent=`${index+1} / ${boards.length}`;$('list').value=index;$('notes').textContent=b.cue;$('native').href=`drawings/scenes/${b.key}.excalidraw`;$('previous').disabled=index===0;$('next').disabled=index===boards.length-1;const label=`Switch to ${dark?'light':'dark'} preview`;$('theme').title=label;$('theme').setAttribute('aria-label',label);document.body.style.background=dark?'#111315':'#fff';cursor()}
function move(n){index=Math.max(0,Math.min(boards.length-1,index+n));show()}
let hintTimer;function hint(text){$('hint').textContent=text;$('hint').classList.add('visible');clearTimeout(hintTimer);hintTimer=setTimeout(()=>$('hint').classList.remove('visible'),1800)}
function hideControls(){const hidden=document.body.classList.toggle('hide');if(hidden){document.activeElement?.blur();hint('Controls hidden · Press H or use the bottom handle to restore')}else $('hint').classList.remove('visible')}
function togglePencil(){pencil=!pencil;document.body.classList.toggle('pointer',!pencil);$('pen').setAttribute('aria-pressed',pencil);clearInk()}
function notes(){const visible=$('notes').hidden;$('notes').hidden=!visible;$('cue').setAttribute('aria-pressed',visible)}
async function fullscreen(){try{if(document.fullscreenElement)await document.exitFullscreen();else await document.documentElement.requestFullscreen()}catch{hint('Use your browser’s fullscreen command')}}
$('previous').onclick=()=>move(-1);$('next').onclick=()=>move(1);$('list').onchange=()=>{index=Number($('list').value);show()};$('theme').onclick=()=>{dark=!dark;show()};$('hide').onclick=hideControls;$('restore').onclick=hideControls;$('pen').onclick=togglePencil;$('clear').onclick=clearInk;$('cue').onclick=notes;$('fullscreen').onclick=fullscreen;
addEventListener('keydown',e=>{if(e.target.matches('select,input,textarea')||e.ctrlKey||e.metaKey||e.altKey)return;const k=e.key.toLowerCase();if(['ArrowRight','PageDown',' '].includes(e.key)){if(e.key===' '&&e.target.tagName==='BUTTON')return;e.preventDefault();move(1)}if(['ArrowLeft','PageUp'].includes(e.key)){e.preventDefault();move(-1)}if(k==='h')hideControls();if(k==='p')togglePencil();if(k==='c')clearInk();if(k==='n')notes();if(k==='f')fullscreen();if(e.key==='Home'){index=0;show()}if(e.key==='End'){index=boards.length-1;show()}if(e.key==='Escape')clearInk()});resize();show();
</script></body></html>
